
<!DOCTYPE html>
<html>
<head>
<title>Toka Fitness Login</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: white;
}

.logo {
    font-size: 24px;
    margin: 5px 16px;
}

.login-box {
    background: black;
    width: 372px;
    height: 230px;
    margin: 40px auto;
    padding: 10px;
    color: white;
}

h2 {
    margin: 0 3px 8px;
    font-weight: normal;
}

label {
    font-size: 24px;
    display: block;
    margin: 5px 3px 2px;
}

input {
    width: 190px;
    height: 35px;
    border: none;
}

button {
    background: white;
    border: none;
    font-size: 24px;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="logo">
Toka<br>Fitness
</div>

<div class="login-box">
    <h2>Login</h2>

    <label>username</label>
    <input type="text">

    <label>password</label>
    <input type="password">

    <br>

    <button>login</button>
    <button>make account</button>
</div>

</body>
</html>
